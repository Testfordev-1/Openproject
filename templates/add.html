{% extends 'base.html' %}

{% block content %}

<div class="card p-4">

<h3>Add Employee</h3>

<form method="POST">

<input
type="text"
name="name"
placeholder="Name"
class="form-control mb-3"
required>

<input
type="text"
name="department"
placeholder="Department"
class="form-control mb-3"
required>

<input
type="number"
name="salary"
placeholder="Salary"
class="form-control mb-3"
required>

<button
class="btn btn-success">

Save

</button>

</form>

</div>

{% endblock %}
