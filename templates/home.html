{% extends 'base.html' %} {% block content %}

<h2>Employees</h2>

<a href="/add" class="btn btn-primary mb-3"> Add Employee </a>

<table class="table table-bordered">
  <tr>
    <th>ID</th>
    <th>Name</th>
    <th>Department</th>
    <th>Salary</th>
    <th>Action</th>
  </tr>

  {% for emp in employees %}

  <tr>
    <td>{{emp[0]}}</td>
    <td>{{emp[1]}}</td>
    <td>{{emp[2]}}</td>
    <td>{{emp[3]}}</td>

    <td>
      <a href="/delete/{{emp[0]}}" class="btn btn-danger"> Delete </a>
    </td>
  </tr>

  {% endfor %}
</table>

{% endblock %}
